[package]
name = "roommute"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "roommute"
path = "src/main.rs"

[dependencies]
audio-io = { package = "roommute-audio-io", path = "../audio-io" }
dsp = { package = "roommute-dsp", path = "../dsp" }

anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
toml.workspace = true
ringbuf.workspace = true

dirs = "6"
hound = "3.5"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.24"
muda = "0.15"
# Only what we actually call: the single-instance mutex, console attach for
# the CLI modes, the HKCU Run key for start-at-login, and MessageBoxW for
# reporting fatal errors when no console is attached.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

# Future: embed a real .ico via the `embed-resource` crate. v1 generates
# its tray icon procedurally so no build.rs is needed.
