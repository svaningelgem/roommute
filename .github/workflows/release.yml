name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'V[0-9]+.[0-9]+.[0-9]+'
      # Pre-release suffixes, e.g. 0.1.0-alpha.1. Without these the publish
      # step's `prerelease` flag is unreachable: it keys off a `-` in the
      # version, which the patterns above cannot match.
      - '[0-9]+.[0-9]+.[0-9]+-*'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
      - 'V[0-9]+.[0-9]+.[0-9]+-*'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  release:
    runs-on: windows-latest
    permissions:
      # Needed to create the release and upload assets.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Version from tag
        id: version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}   # e.g. v1.2.3
          VERSION=${VERSION#v}
          VERSION=${VERSION#V}
          echo "Releasing $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp the version into Cargo.toml
        shell: bash
        run: |
          # Workspace package version — the crates inherit it.
          sed -i -E "0,/^version = \".*\"/s//version = \"${{ steps.version.outputs.version }}\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml
          cargo update -w   # refresh the lockfile for the new version

      # Before the test gates, not just before packaging: the ONNX tests load
      # a real session, and they refuse to skip when CI is set.
      - name: Fetch ONNX Runtime
        shell: bash
        run: |
          # MIT licensed and redistributable, so it ships inside the installer.
          # Pinned: ort 2.0.0-rc.10 speaks ONNX Runtime API version 22 = 1.22.x.
          curl -sSfL -o ort.zip \
            https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-win-x64-1.22.0.zip
          unzip -q ort.zip
          mkdir -p target/debug target/release
          cp onnxruntime-win-x64-1.22.0/lib/onnxruntime.dll target/debug/
          cp onnxruntime-win-x64-1.22.0/lib/onnxruntime.dll target/release/

      # The same gates as CI. A tag should never publish something that
      # wouldn't have passed a pull request.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        if: always()
        run: cargo clippy --all-targets --all-features

      - name: Test
        if: always()
        run: cargo test --all-features

      - name: Coverage
        if: always()
        run: cargo llvm-cov --all-features --fail-under-lines 74

      - name: Build
        run: cargo build --release --all-features

      # ---------------------------------------------------------------
      # Release signing, commented out until SignPath Foundation approves the
      # application — their review is manual and may not be granted. Kept
      # rather than deleted so turning it on is: delete the "# " prefixes,
      # restore the job-level env below, and add four repository settings.
      #
      #   env:
      #     SIGNING_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
      #
      # docs/signing.md has the settings and the two ordering rules that are
      # easy to get wrong.
      # ---------------------------------------------------------------
      # # Signing, if this repository has been enrolled. Without the secret every
      # # step below is skipped and the release goes out unsigned, exactly as it
      # # did before — a missing credential must not fail a release.
      # #
      # # The executable is signed *before* the installer is built, because the
      # # installer embeds it and Windows judges the extracted binary on its own
      # # signature. Signing only the installer leaves the thing users actually
      # # run unsigned. Checksums are taken after all of this, since a signature
      # # changes the bytes.
      # - name: Upload the executable for signing
      #   id: upload-exe
      #   if: env.SIGNING_ENABLED == 'true'
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: unsigned-executable
      #     path: target/release/roommute.exe

      # - name: Sign the executable
      #   if: env.SIGNING_ENABLED == 'true'
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      #     project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      #     signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
      #     artifact-configuration-slug: executable
      #     github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: signed/executable

      # - name: Put the signed executable back
      #   if: env.SIGNING_ENABLED == 'true'
      #   shell: bash
      #   run: |
      #     cp signed/executable/roommute.exe target/release/roommute.exe
      #     # A signature that did not attach is worse than none: the release
      #     # would claim to be signed and would not be. Compared as a string
      #     # rather than through PowerShell's exit code, which inverts booleans
      #     # ($true leaves 1, which shells read as failure).
      #     exe="target/release/roommute.exe"
      #     status=$(powershell -NoProfile -Command "(Get-AuthenticodeSignature '$exe').Status")
      #     echo "roommute.exe signature: $status"
      #     [ "$status" = "Valid" ] || { echo "::error::roommute.exe is not validly signed"; exit 1; }


      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: cmd
        run: |
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.version }} installer\roommute.iss

      # - name: Upload the installer for signing
      #   id: upload-setup
      #   if: env.SIGNING_ENABLED == 'true'
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: unsigned-installer
      #     path: dist/RoomMute-${{ steps.version.outputs.version }}-setup.exe

      # - name: Sign the installer
      #   if: env.SIGNING_ENABLED == 'true'
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      #     project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      #     signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
      #     artifact-configuration-slug: installer
      #     github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: signed/installer

      # - name: Put the signed installer back
      #   if: env.SIGNING_ENABLED == 'true'
      #   shell: bash
      #   run: |
      #     setup="dist/RoomMute-${{ steps.version.outputs.version }}-setup.exe"
      #     cp "signed/installer/RoomMute-${{ steps.version.outputs.version }}-setup.exe" "$setup"
      #     status=$(powershell -NoProfile -Command "(Get-AuthenticodeSignature '$setup').Status")
      #     echo "installer signature: $status"
      #     [ "$status" = "Valid" ] || { echo "::error::the installer is not validly signed"; exit 1; }


      - name: Package the portable build
        shell: bash
        run: |
          mkdir -p dist/portable
          cp target/release/roommute.exe target/release/onnxruntime.dll \
             README.md LICENSE-MIT LICENSE-APACHE dist/portable/
          # The model, and the attribution that has to travel with it.
          mkdir -p dist/portable/model
          cp models/dfn3/* dist/portable/model/
          cp models/NOTICE.md dist/portable/
          cd dist/portable
          7z a "../RoomMute-${{ steps.version.outputs.version }}-portable.zip" .

      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.exe *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: RoomMute ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            dist/RoomMute-${{ steps.version.outputs.version }}-setup.exe
            dist/RoomMute-${{ steps.version.outputs.version }}-portable.zip
            dist/SHA256SUMS.txt
          body: |
            ## Install

            Download **RoomMute-${{ steps.version.outputs.version }}-setup.exe** and run it.
            It installs per-user, so there is no administrator prompt.

            RoomMute also needs a virtual audio cable so other apps can hear the
            cleaned microphone — it will explain this on first run and offer to
            open the download page.

            The portable zip is the same binary without an installer; unzip and run
            `roommute.exe`.

            Verify your download against `SHA256SUMS.txt`.

            > SmartScreen may warn on first run. Signing does not remove that on
            > its own — Windows builds trust per file as downloads accumulate, and
            > a brand-new release has none. Choose "More info" then "Run anyway",
            > or verify the checksum above.
