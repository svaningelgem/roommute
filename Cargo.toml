[workspace]
resolver = "2"
members = [
    "crates/audio-io",
    "crates/dsp",
    "crates/app",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
# 1.82 is where `Option::is_none_or` stabilised, which the pipeline uses.
# Nothing verifies this — CI builds with stable — so treat it as the lowest
# version known to work rather than the lowest that does.
rust-version = "1.82"
license = "MIT OR Apache-2.0"
authors = [
    "Yashsomalkar <Yashsomalkar@users.noreply.github.com>",
    "Steven Van Ingelgem <steven@vaningelgem.be>",
]
description = "Real-time microphone noise cancellation for Windows. DeepFilterNet3 inference in pure Rust, WASAPI low-latency capture/render, routes cleaned audio into VB-Cable for Zoom/Teams/Discord/OBS."
repository = "https://github.com/svaningelgem/roommute"
homepage = "https://github.com/svaningelgem/roommute"
documentation = "https://github.com/svaningelgem/roommute#readme"
readme = "README.md"
keywords = ["audio", "noise-cancellation", "wasapi", "deepfilternet", "windows"]
categories = ["multimedia::audio", "os::windows-apis"]

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ringbuf = "0.5"
crossbeam-channel = "0.5"

# tract validates node-name uniqueness only when debug assertions are on, and
# DeepFilterNet3's published export has a duplicate (`/convt3/Conv.bias`). The
# release build loads it happily and produces output that correlates 1.0000
# with the reference, so the graph itself is sound -- but a debug test binary
# refuses it, which would leave the shipping backend permanently untestable.
[profile.test.package.tract-core]
debug-assertions = false

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "abort"

[profile.release-with-debug]
inherits = "release"
debug = true
strip = "none"
